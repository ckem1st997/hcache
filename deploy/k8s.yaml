# Hotstash on Kubernetes or k3s: one replica keeping its data on a volume.
# The password comes from a Secret made beforehand:
#
#   kubectl create secret generic hotstash --from-literal=password=...
#   kubectl apply -f deploy/k8s.yaml
#
# The image is the one CI publishes from the main branch; for your own
# build, change `image` below to where you pushed it.
# Only pods labelled hotstash-client: "true" may connect (NetworkPolicy, where
# the cluster's network plugin enforces it; k3s does by default).
apiVersion: v1
kind: Service
metadata:
  name: hotstash
spec:
  selector:
    app: hotstash
  ports:
    - name: resp
      port: 6379
      targetPort: resp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hotstash
spec:
  serviceName: hotstash
  replicas: 1
  selector:
    matchLabels:
      app: hotstash
  template:
    metadata:
      labels:
        app: hotstash
    spec:
      # SIGTERM gets 20 s to write everything to disk; this leaves room.
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hotstash
          image: ghcr.io/ckem1st997/hotstash:latest
          imagePullPolicy: Always
          args: ["--bind", "0.0.0.0", "--data", "/data/hotstash.aof"]
          env:
            - name: HOTSTASH_REQUIREPASS
              valueFrom:
                secretKeyRef:
                  name: hotstash
                  key: password
          ports:
            - name: resp
              containerPort: 6379
          # Requests equal to limits: the Guaranteed class, evicted last.
          # maxmemory follows the memory limit (--maxmemory auto): here
          # 768 MiB for data, the rest for the process around it.
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["/usr/local/bin/hotstash-server", "healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/hotstash-server", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Loading a large append-only file takes a while.
          startupProbe:
            exec:
              command: ["/usr/local/bin/hotstash-server", "healthcheck"]
            periodSeconds: 2
            failureThreshold: 300
          # The endpoint goes before the process stops taking connections.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotstash
spec:
  podSelector:
    matchLabels:
      app: hotstash
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              hotstash-client: "true"
      ports:
        - port: 6379
