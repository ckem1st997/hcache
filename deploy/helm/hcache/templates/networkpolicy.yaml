{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcache.fullname" . }}
  labels:
    {{- include "hcache.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hcache.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientLabels | nindent 14 }}
      ports:
        - port: 6379
    {{- if .Values.metrics.enabled }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: {{ .Values.metrics.port }}
    {{- end }}
{{- end }}
