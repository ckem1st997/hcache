{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hcache.fullname" . }}
  labels:
    {{- include "hcache.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ "default" | b64enc }}
  password: {{ required "auth.password or auth.existingSecret is needed" .Values.auth.password | b64enc }}
{{- end }}
