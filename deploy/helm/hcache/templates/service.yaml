apiVersion: v1
kind: Service
metadata:
  name: {{ include "hcache.fullname" . }}
  labels:
    {{- include "hcache.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hcache.selectorLabels" . | nindent 4 }}
  ports:
    - name: resp
      port: 6379
      targetPort: resp
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
